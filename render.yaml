# render.yaml — Despliegue JORANA IA en Render.com
# Repositorio: https://github.com/Looopxs/SISTEMA-DE-REVISION-DE-TESIS

databases:
  - name: jorana-db
    databaseName: kimy_thesis
    user: kimy
    plan: free
    region: oregon

services:
  # ============================================================
  # REDIS EN LA NUBE (Render)
  # ============================================================
  - type: redis
    name: jorana-redis
    plan: free
    region: oregon
    ipAllowList: [] # Solo interno

  # ============================================================
  # BACKEND — NestJS API
  # ============================================================
  - type: web
    name: jorana-ia-api
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/api

    buildCommand: |
      cd ../..
      npm install --legacy-peer-deps --include=dev
      npx prisma@6.3.0 generate --schema=packages/database/prisma/schema.prisma
      cd packages/ai-engine && npx tsc
      cd ../../apps/api && npx nest build
      cd ../..
      npx prisma@6.3.0 db push --schema=packages/database/prisma/schema.prisma --accept-data-loss
      npm run db:seed

    startCommand: node dist/main.js

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: FRONTEND_URL
        value: "https://jorana-ia-web.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: jorana-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: jorana-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: jorana-redis
          property: port
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  # ============================================================
  # FRONTEND — Next.js Web
  # ============================================================
  - type: web
    name: jorana-ia-web
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/web

    buildCommand: |
      cd ../..
      npm install --legacy-peer-deps --include=dev
      npx turbo run build --filter=@kimy/web

    startCommand: npm run start

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://jorana-ia-api.onrender.com"
